<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Yupdduk Spicy Mascot Icon -->
  <g transform="translate(5, 5)">
    <!-- Red Spicy Bowl / Chili Body -->
    <circle cx="30" cy="30" r="28" fill="#DE1D24" />
    <path d="M12 30 Q30 48 48 30 Q48 42 30 52 Q12 42 12 30Z" fill="#B51218" opacity="0.3"/>
    
    <!-- Chili Stem / Green Leaf -->
    <path d="M26 6 C28 0 38 2 34 10 C32 10 30 8 26 6Z" fill="#2E7D32"/>
    <path d="M30 8 C33 4 39 5 36 11Z" fill="#4CAF50"/>
    
    <!-- Character Face / Expression -->
    <ellipse cx="23" cy="27" rx="3" ry="4" fill="#FFFFFF"/>
    <ellipse cx="37" cy="27" rx="3" ry="4" fill="#FFFFFF"/>
    <circle cx="23" cy="28" r="2" fill="#1A1A1A"/>
    <circle cx="37" cy="28" r="2" fill="#1A1A1A"/>
    <circle cx="24" cy="26" r="0.8" fill="#FFFFFF"/>
    <circle cx="38" cy="26" r="0.8" fill="#FFFFFF"/>
    
    <!-- Rosy Cheeks -->
    <ellipse cx="18" cy="33" rx="3" ry="2" fill="#FF8A80" opacity="0.8"/>
    <ellipse cx="42" cy="33" rx="3" ry="2" fill="#FF8A80" opacity="0.8"/>
    
    <!-- Happy Spicy Tongue Smile -->
    <path d="M25 34 Q30 43 35 34 Z" fill="#FFFFFF"/>
    <path d="M26 36 Q30 42 34 36 Q32 39 30 41 Q28 39 26 36 Z" fill="#FF5252"/>
    
    <!-- Floating Sweat / Fire Drops -->
    <path d="M48 18 C51 15 54 20 50 23 C48 21 47 19 48 18Z" fill="#FBC02D"/>
  </g>
  
  <!-- Text: 동대문 엽기떡볶이 -->
  <g transform="translate(70, 14)">
    <text x="0" y="24" font-family="'Pretendard', sans-serif" font-weight="900" font-size="24" fill="#DE1D24" letter-spacing="-0.5px">동대문</text>
    <text x="70" y="24" font-family="'Pretendard', sans-serif" font-weight="900" font-size="26" fill="#1A1A1A" letter-spacing="-1px">엽기떡볶이</text>
    <text x="2" y="39" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="700" font-size="8.5" fill="#757575" letter-spacing="2.5px">DONGDAEMUN YUPDDUK</text>
  </g>
