  <!-- Bowl Outer Rim -->
  <ellipse cx="100" cy="100" rx="85" ry="60" fill="#F4F4F6" stroke="#D1D5DB" stroke-width="3"/>
  <ellipse cx="100" cy="98" rx="80" ry="55" fill="#FFFFFF"/>
  <ellipse cx="100" cy="96" rx="72" ry="48" fill="#E5E7EB"/>
  
  <!-- Spicy Red Tteokbokki Soup -->
  <ellipse cx="100" cy="96" rx="68" ry="44" fill="#C9181E"/>
  <ellipse cx="100" cy="94" rx="64" ry="40" fill="#E02228"/>
  
  <!-- Rice Cakes & Sausages Peeking -->
  <!-- Tteok 1 -->
  <path d="M70 85 C65 82 85 75 90 82 C85 88 65 92 70 85 Z" fill="#FFF8E7" opacity="0.9"/>
  <!-- Tteok 2 -->
  <path d="M110 100 C105 95 125 90 130 98 C125 105 105 108 110 100 Z" fill="#FFF8E7" opacity="0.85"/>
  <!-- Sausage with cuts -->
  <ellipse cx="65" cy="105" rx="14" ry="7" fill="#8D2323" transform="rotate(-20 65 105)"/>
  <line x1="57" y1="103" x2="63" y2="108" stroke="#460D0D" stroke-width="1.5"/>
  <line x1="63" y1="101" x2="69" y2="106" stroke="#460D0D" stroke-width="1.5"/>
  
  <!-- Melted Mozzarella Cheese Swirl (Signature Yupdduk) -->
  <path d="M60 92 Q80 115 110 105 Q135 95 140 85 Q130 80 105 92 Q80 102 70 88 Z" fill="#FFFBE6" stroke="#FFE082" stroke-width="1"/>
  <path d="M75 95 C90 120 125 105 135 88 C120 85 95 110 80 94 Z" fill="#FFF9C4"/>
  <circle cx="95" cy="102" r="8" fill="#FFFDE7" opacity="0.8"/>
  
  <!-- Parsley Flecks -->
  <circle cx="85" cy="98" r="1.5" fill="#2E7D32"/>
  <circle cx="105" cy="102" r="1.2" fill="#2E7D32"/>
  <circle cx="120" cy="92" r="1.5" fill="#2E7D32"/>
  <circle cx="98" cy="90" r="1" fill="#1B5E20"/>
  <circle cx="75" cy="90" r="1.2" fill="#2E7D32"/>
  <circle cx="112" cy="112" r="1.3" fill="#2E7D32"/>
